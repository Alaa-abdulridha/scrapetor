name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ruby-${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl + brotli + zstd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libbrotli-dev libzstd-dev

      - name: Install brotli + zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install brotli zstd || true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test

  bench:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Listing benchmark
        run: bundle exec ruby -Ilib benchmark/parse_extract.rb

      - name: Product-detail benchmark
        run: bundle exec ruby -Ilib benchmark/product_detail.rb
