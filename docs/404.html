<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - page not found · Scrapetor</title>
<meta name="description" content="The page you were looking for isn't here. Head back to scrapetor.org for the Scrapetor Ruby gem.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://scrapetor.org/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #ffffff; --text: #18181b; --text-soft: #52525b; --accent: #b45309;
    --border: #e7e5e4; --surface: #fafaf9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0a; --text: #fafafa; --text-soft: #d4d4d8; --accent: #f59e0b;
            --border: #27272a; --surface: #18181b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    padding: 2rem;
  }
  .card { text-align: center; max-width: 480px; }
  .mark {
    display: inline-block;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-size: 2.25rem;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
    font-weight: 800;
  }
  p { color: var(--text-soft); margin: 0 0 1.5rem; }
  a.btn {
    display: inline-block;
    padding: 0.6rem 1.1rem;
    background: var(--text);
    color: var(--bg);
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
  }
  a.btn:hover { opacity: 0.92; }
  code {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.1em 0.4em;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.9em;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#d97706"/>
      <path d="M22 21h14a6 6 0 0 1 0 12h-9a6 6 0 0 0 0 12h13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>Lost.</h1>
    <p>That page isn't here. It may have moved, or the link is wrong.</p>
    <a class="btn" href="/">Go to scrapetor.org</a>
  </div>
</body>
</html>
